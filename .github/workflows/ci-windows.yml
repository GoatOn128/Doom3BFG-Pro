name: build-windows

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The engine only ships a Windows system layer (neo/sys/win32, XAudio2
# sound). There is no posix/linux/osx/macos layer to build against yet,
# so linux and macos legs stay out of the matrix until one exists.
jobs:
  build:
    name: windows-x86-${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: build
        id: build
        shell: pwsh
        run: |
          $fail = 0
          # the CMake project lives in neo/, not the repo root
          & cmake -S neo -B out -A Win32 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          if ($fail -eq 0) {
            & cmake --build out --config ${{ matrix.configuration }} --parallel 2>&1 | Tee-Object -FilePath build.log -Append
            if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          }
          exit $fail

      - name: digest
        if: always()
        env:
          LEG: windows-x86-${{ matrix.configuration }}
          STATUS: ${{ steps.build.outcome }}
        shell: pwsh
        run: python .github/scripts/digest.py

      - name: report
        if: failure()
        shell: pwsh
        env:
          LEG: windows-x86-${{ matrix.configuration }}
        run: |
          # job logs are admin-only on this repo, so the failure reasons
          # are surfaced as annotations too: they are readable without auth
          $frag = "digest-fragment-$env:LEG.md"
          if (-not (Test-Path $frag)) { exit 0 }
          $seen = New-Object 'System.Collections.Generic.HashSet[string]'
          $count = 0
          foreach ($l in Get-Content $frag) {
            if ($count -ge 10) { break }
            $t = $l.Trim()
            if ($t.Length -lt 8) { continue }
            if ($t -notmatch 'cmake error|fatal error|error [A-Z]+[0-9]|Build FAILED|FAILED') { continue }
            if (-not $seen.Add($t)) { continue }
            $msg = ($t -replace '%', '%25') -replace '\\', '%5C'
            if ($msg.Length -gt 350) { $msg = $msg.Substring(0, 350) }
            Write-Host "::error title=error $($count + 1) ($env:LEG)::$msg"
            $count++
          }

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-x86-${{ matrix.configuration }}
          path: |
            build.log
            status-*
            digest-fragment-*
            log-*.log
          if-no-files-found: error

      - name: upload binaries
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows-x86-${{ matrix.configuration }}
          path: out/bin/*.exe
          if-no-files-found: warn
