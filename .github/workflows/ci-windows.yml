name: build-windows

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The engine only ships a Windows system layer (neo/sys/win32, XAudio2
# sound). There is no posix/linux/osx/macos layer to build against yet,
# so linux and macos legs stay out of the matrix until one exists.
jobs:
  build:
    name: windows-x86-${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: build
        id: build
        shell: pwsh
        run: |
          $fail = 0
          # the CMake project lives in neo/, not the repo root
          & cmake -S neo -B out -A Win32 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          if ($fail -eq 0) {
            & cmake --build out --config ${{ matrix.configuration }} --parallel 2>&1 | Tee-Object -FilePath build.log -Append
            if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          }
          exit $fail

      - name: digest
        if: always()
        env:
          LEG: windows-x86-${{ matrix.configuration }}
          STATUS: ${{ steps.build.outcome }}
        shell: pwsh
        run: python .github/scripts/digest.py

      - name: report
        if: failure()
        shell: pwsh
        env:
          LEG: windows-x86-${{ matrix.configuration }}
        run: |
          # job logs are admin-only, so the failure reasons are surfaced
          # as annotations: they are readable without auth. build.log is
          # read directly because the digest regex can miss error kinds.
          $lines = @()
          if (Test-Path build.log) { $lines = Get-Content build.log }
          $clean = { param($s) (($s -replace '%', '%25') -replace "\r|\n", ' ') }
          $seen = New-Object 'System.Collections.Generic.HashSet[string]'
          $count = 0
          foreach ($l in $lines) {
            if ($count -ge 8) { break }
            $t = $l.Trim()
            if ($t.Length -lt 8) { continue }
            if ($t -notmatch 'cmake error|fatal error|error [A-Z]+[0-9]|command line error|build failed|FAILED') { continue }
            if (-not $seen.Add($t)) { continue }
            $msg = & $clean $t
            if ($msg.Length -gt 400) { $msg = $msg.Substring(0, 400) }
            Write-Host "::error title=error $($count + 1) ($env:LEG)::$msg"
            $count++
          }
          # always also post the log tail: failures that print no
          # recognized error line (crashes, aborts) stay visible this way
          $tail = [array]($lines | Where-Object { $_.Trim().Length -gt 0 } | Select-Object -Last 24)
          if ($tail.Count -gt 0) {
            $chunks = [Math]::Ceiling($tail.Count / 8)
            for ($c = 0; $c -lt $chunks; $c++) {
              $part = @()
              for ($k = $c * 8; $k -lt [Math]::Min($c * 8 + 8, $tail.Count); $k++) {
                $l = $tail[$k].Trim()
                if ($l.Length -gt 110) { $l = $l.Substring(0, 110) }
                $part += $l
              }
              $msg = & $clean ($part -join ' | ')
              if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
              Write-Host "::error title=log tail $($c + 1) ($env:LEG)::$msg"
            }
          }

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-x86-${{ matrix.configuration }}
          path: |
            build.log
            status-*
            digest-fragment-*
            log-*.log
          if-no-files-found: error

      - name: upload binaries
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows-x86-${{ matrix.configuration }}
          path: out/bin/*.exe
          if-no-files-found: warn
