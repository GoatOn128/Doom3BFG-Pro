name: cleanup-tno-renderprogs

# One-shot cleanup for the TNO decompiled renderprogs that the old sync
# workflow copied into base/renderprogs. The TNO progs are not used
# anymore: m1 converts the BFG shaders onto the new renderprog path
# instead. The job deletes the data with a GITHUB_TOKEN push and then
# tries to delete this workflow file; if that push is rejected the
# inert file stays behind.

on:
  push:
    branches: [m1-renderprogs]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-tno-renderprogs]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Remove the synced TNO renderprogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch             'base/renderprogs/*.vglsl'             'base/renderprogs/*.pglsl'             'base/renderprogs/*.parms'             'base/renderprogs/global_tno.inc'             'docs/m1-parm-inventory.md'             '.github/scripts/renderprog_inventory.py'
          git commit -q -m "Remove the TNO decompiled renderprogs data [cleanup-tno-renderprogs]"
          if ! git push origin HEAD:m1-renderprogs; then
            echo "::error::failed to push the data removal commit"
            exit 1
          fi

      - name: Remove this workflow file
        run: |
          git rm -q '.github/workflows/sync-tno-renderprogs.yml'
          git commit -q -m "Remove the one-shot cleanup workflow [cleanup-tno-renderprogs]"
          if ! git push origin HEAD:m1-renderprogs; then
            echo "::warning::workflow file push rejected, leaving the inert workflow in place"
          fi
