name: sync-tno-renderprogs

on:
  push:
    branches: ['m1-renderprogs']

concurrency:
  group: sync-tno-renderprogs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: copy-tno-renderprogs
    runs-on: ubuntu-latest
    # only the push that carries the tag copies data; every other push
    # to the branch leaves this job skipped
    if: contains(github.event.head_commit.message, '[sync-renderprogs]')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: copy
        run: |
          set -e
          src=references/wolftno/base/renderprogs
          dst=base/renderprogs
          mkdir -p "$dst"
          # the TNO shaders include "global.inc", but base/renderprogs
          # already holds the BFG Cg-era global.inc that the old loader
          # still reads; the TNO copy ships as global_tno.inc until the
          # old loader is retired in the switchover phase
          find "$src" -maxdepth 1 -type f ! -name 'global.inc' -exec cp '{}' "$dst/" \;
          cp "$src/global.inc" "$dst/global_tno.inc"

      - name: inventory
        run: python3 .github/scripts/renderprog_inventory.py

      - name: publish
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base/renderprogs docs/m1-parm-inventory.md
          git diff --cached --quiet && exit 0
          git commit -m "Copy the TNO decompiled renderprogs into base [skip ci]"
          if ! out=$(git push 2>&1); then
            git pull --rebase -X theirs origin "$HEAD_BRANCH"
            git push
          fi
